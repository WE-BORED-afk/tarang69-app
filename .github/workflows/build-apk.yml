name: Build & Release Android APK

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'scripts/**'
      - '**.md'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Static Analysis & Flutter Tests
        run: |
          flutter analyze --no-fatal-infos
          flutter test

      - name: Decode Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "Error: Missing Android signing secrets." >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n' | base64 --decode > android/app/upload-keystore.jks
          test -s android/app/upload-keystore.jks

      - name: Build Release APK
        env:
          KEYSTORE_PATH: upload-keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          flutter build apk --release --build-name=1.0.${{ github.run_number }} --build-number=${{ github.run_number }}
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/tarang69-v1.0.${{ github.run_number }}.apk

      - name: Run Android Kotlin Unit Tests
        run: |
          cd android
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tarang69-app-release
          path: build/app/outputs/flutter-apk/tarang69-v1.0.${{ github.run_number }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: TARANG69 Android APK - v1.0.${{ github.run_number }}
          body: |
            🎉 **TARANG69 Android APK - v1.0.${{ github.run_number }}**
            
            - ดาวน์โหลดไฟล์ `tarang69-v1.0.${{ github.run_number }}.apk` หรือ `app-release.apk` ด้านล่างไปติดตั้งบนมือถือได้ทันที
            - เมื่อติดตั้งแล้ว สามารถกดค้างที่หน้าจอ Home เพื่อเพิ่ม Widget "TARANG69" ได้เลยครับ
          files: |
            build/app/outputs/flutter-apk/tarang69-v1.0.${{ github.run_number }}.apk
            build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
